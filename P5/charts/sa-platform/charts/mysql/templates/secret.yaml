apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-mysql"
  labels:
    app: mysql
type: Opaque
stringData:
  mysql-root-password: {{ .Values.auth.rootPassword }}
  DB_USER: {{ .Values.auth.username }}
  DB_PASSWORD: {{ .Values.auth.password }}
  DB_NAME: {{ .Values.auth.database }}
