apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-mysql-init"
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS auth_db;
    CREATE DATABASE IF NOT EXISTS orders_db;

    -- Otorgar permisos al usuario (asumiendo que MySQL crea el usuario si se le pasaron las vars, o lo podemos crear explícitamente)
    GRANT ALL PRIVILEGES ON auth_db.* TO '{{ .Values.auth.username }}'@'%';
    GRANT ALL PRIVILEGES ON orders_db.* TO '{{ .Values.auth.username }}'@'%';
    FLUSH PRIVILEGES;

    USE auth_db;

    CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        carnet VARCHAR(50) UNIQUE NOT NULL,
        nombres_encrypted TEXT NOT NULL,
        apellidos_encrypted TEXT NOT NULL,
        correo_encrypted TEXT NOT NULL,
        password_hash TEXT NOT NULL,
        rol VARCHAR(20) NOT NULL
    );

    USE orders_db;

    CREATE TABLE IF NOT EXISTS orders (
        id INT AUTO_INCREMENT PRIMARY KEY,
        user_id INT NOT NULL,
        total DECIMAL(10, 2) NOT NULL,
        status VARCHAR(20) NOT NULL DEFAULT 'PENDING',
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS order_items (
        id INT AUTO_INCREMENT PRIMARY KEY,
        order_id INT NOT NULL,
        product_id VARCHAR(50) NOT NULL,
        quantity INT NOT NULL,
        unit_price DECIMAL(10, 2) NOT NULL,
        FOREIGN KEY (order_id) REFERENCES orders(id) ON DELETE CASCADE
    );
