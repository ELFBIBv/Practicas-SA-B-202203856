name: CI/CD - Plataforma de Microservicios (Practica 8)

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy:
        description: "Proponer el despliegue: abre un PR al repo GitOps con las imágenes recién publicadas (requiere GITOPS_PAT configurado). El pipeline ya NO aplica nada directo al clúster; ArgoCD es quien sincroniza tras el merge."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: elfbibv
  BASELINE_IMAGE_TAG: v8.0.0
  HEALTHY_CANARY_IMAGE_TAG: v8.0.1
  FAULT_CANARY_IMAGE_TAG: v8.0.2

jobs:
  # ---------------------------------------------------------------------
  # Etapa 1: build + test. Un job por servicio para que cada stack
  # (Node, Python, Go) use exactamente sus propias dependencias e
  # imagen base de pruebas, y para que un fallo puntual sea fácil de leer
  # en la pestaña Actions.
  # ---------------------------------------------------------------------

  test-auth-service:
    name: "Test: auth-service (Node/TypeScript)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P8/auth/auth-service
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: P8/auth/auth-service/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build (compilar TypeScript)
        run: pnpm run build

      - name: Ejecutar pruebas unitarias
        run: pnpm run test

  test-catalog-service:
    name: "Test: catalog-service (Python + MongoDB real)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P8/catalog/catalog-service
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: P8/catalog/catalog-service/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: pytest -v
        env:
          MONGO_URI: "mongodb://localhost:27017/catalog_db_test"

  test-order-service:
    name: "Test: order-service (Python + MySQL real)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P8/orders/order-service
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orders_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: P8/orders/order-service/requirements-dev.txt

      - name: Aplicar el esquema de orders al MySQL de la CI
        run: mysql -h127.0.0.1 -uroot -proot orders_db_test < orders-db/init.sql
        working-directory: P8/orders

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: pytest -v
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: "root"
          DB_NAME: "orders_db_test"

  test-notification-service:
    name: "Test: notification-service (Go)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P8/notifications/notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: P8/notifications/notification-service/go.mod
          cache-dependency-path: P8/notifications/notification-service/go.sum

      - name: Vet (análisis estático)
        run: go vet ./...

      - name: Ejecutar pruebas
        run: go test ./... -v

  test-cron1:
    name: "Test: cron1 (Python + MySQL real)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P8/cronjobs/cron1
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cron_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: P8/cronjobs/cron1/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: pytest -v
        env:
          DB_HOST: "127.0.0.1"
          DB_USER: "root"
          DB_PASSWORD: "root"
          DB_NAME: "cron_test"

  test-cron2:
    name: "Test: cron2 (Python + MySQL real + NATS simulado)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P8/cronjobs/cron2
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cron_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: P8/cronjobs/cron2/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: pytest -v
        env:
          DB_HOST: "127.0.0.1"
          DB_USER: "root"
          DB_PASSWORD: "root"
          DB_NAME: "cron_test"

  # ---------------------------------------------------------------------
  # Etapa 2 y 3: dockerización + push al registry (GHCR). Corre solo si
  # las 6 suites de pruebas anteriores pasaron. En un pull_request solo
  # construye las imágenes (push: false) para validar los Dockerfile sin
  # publicar nada.
  # ---------------------------------------------------------------------
  build-and-push:
    name: "Build & Push: ${{ matrix.name }}"
    needs:
      - test-auth-service
      - test-catalog-service
      - test-order-service
      - test-notification-service
      - test-cron1
      - test-cron2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # requerido por cosign para firma "keyless" vía OIDC de GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            context: P8/api-gateway
            image: sa-api-gateway
          - name: auth-service
            context: P8/auth/auth-service
            image: sa-auth-service
          - name: catalog-service
            context: P8/catalog/catalog-service
            image: sa-catalog-service
          - name: order-service
            context: P8/orders/order-service
            image: sa-order-service
          - name: notification-service
            context: P8/notifications/notification-service
            image: sa-notification-service
          - name: cron1
            context: P8/cronjobs/cron1
            image: sa-cron1
          - name: cron2
            context: P8/cronjobs/cron2
            image: sa-cron2
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      # Build local (push: false) para poder escanear la imagen ANTES de
      # publicarla en GHCR. Nada se sube al registry todavía en este paso.
      - name: Build (local, sin publicar)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Primer tag (referencia local para escanear/firmar)
        id: tagref
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "tag=$FIRST_TAG" >> "$GITHUB_OUTPUT"

      # Reporte completo (CRITICAL+HIGH), nunca bloquea: es la evidencia de
      # "Reporte de Trivy" que pide el enunciado, se sube como artifact aun
      # si el escaneo bloqueante de abajo hace fallar el job.
      - name: Trivy — generar reporte (no bloqueante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tagref.outputs.tag }}
          format: json
          output: trivy-report-${{ matrix.name }}.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Subir reporte de Trivy como artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.name }}
          path: trivy-report-${{ matrix.name }}.json
          retention-days: 30

      # Bloqueante: cualquier vulnerabilidad CRITICAL detiene el job antes
      # de publicar nada en GHCR. Corre también en pull_request (ahí es
      # donde la rúbrica pide evidencia de "PR bloqueado").
      - name: Trivy — bloquear por vulnerabilidad crítica
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tagref.outputs.tag }}
          format: table
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: false

      # SBOM: solo se genera si la imagen pasó el escaneo bloqueante de
      # arriba (no tiene sentido documentar el contenido de una imagen que
      # ni siquiera se va a publicar).
      - name: Generar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tagref.outputs.tag }}
          format: cyclonedx
          output: sbom-${{ matrix.name }}.json

      - name: Subir SBOM como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.json
          retention-days: 30

      - name: Publicar en GHCR
        id: push
        if: github.event_name != 'pull_request'
        run: |
          first_tag=""
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
              [ -z "$first_tag" ] && first_tag="$tag"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"
          # El digest que hay que firmar es el que quedó publicado de
          # verdad, no steps.build.outputs.digest (ese es el digest del
          # build LOCAL con --load, de antes de publicar, usado solo para
          # que Trivy escanee antes de subir nada). BuildKit puede agregar
          # provenance/attestations al pushear que cambian el digest del
          # manifest respecto al build local — firmar el digest equivocado
          # deja la imagen realmente publicada sin firma verificable
          # (Kyverno la rechaza con "no signatures found" aunque el propio
          # paso de firma haya reportado éxito).
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$first_tag" | sed 's/^.*@//')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Instalar Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # Firma "keyless": usa el OIDC token que GitHub Actions ya provee
      # (permissions.id-token: write más arriba), sin manejar llaves
      # privadas. La identidad firmante queda registrada en el log
      # transparente público de Sigstore (Rekor).
      - name: Firmar la imagen con Cosign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}"
          DIGEST="${{ steps.push.outputs.digest }}"
          cosign sign "$IMAGE@$DIGEST"
          cosign attach sbom --sbom sbom-${{ matrix.name }}.json "$IMAGE@$DIGEST"
          echo "Imagen firmada: $IMAGE@$DIGEST"

  # ---------------------------------------------------------------------
  # Etapa 4: despliegue efímero en kind (Kubernetes in Docker). Corre
  # automáticamente después de build-and-push (nunca antes: sigue el
  # principio "build once, deploy many" — se prueba exactamente la misma
  # imagen que ya se publicó en GHCR, no una reconstruida aparte). Crea un
  # clúster de Kubernetes real (aunque temporal) dentro del propio runner,
  # descarga ahí las 7 imágenes recién publicadas, las carga al clúster y
  # aplica el mismo chart de Helm que se usaría en producción. El clúster
  # se destruye solo al terminar el job. No corre en Pull Requests porque
  # ahí `build-and-push` no publica ninguna imagen (solo la valida).
  # ---------------------------------------------------------------------
  deploy-kind:
    name: "Despliegue K8s efímero (kind)"
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar las 7 imágenes ya publicadas en GHCR
        run: |
          declare -A IMAGES=(
            [api-gateway]=sa-api-gateway
            [auth]=sa-auth-service
            [catalog]=sa-catalog-service
            [orders]=sa-order-service
            [notifications]=sa-notification-service
            [cron1]=sa-cron1
            [cron2]=sa-cron2
          )
          SHORT_SHA="${GITHUB_SHA:0:7}"
          for plain in "${!IMAGES[@]}"; do
            ghcr_image="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${IMAGES[$plain]}:${SHORT_SHA}"
            docker pull "$ghcr_image"
            docker tag "$ghcr_image" "${plain}:${BASELINE_IMAGE_TAG}"
          done

      - name: Crear clúster local con kind
        uses: helm/kind-action@v1
        with:
          cluster_name: p8-kind

      - name: Cargar las imágenes al clúster de kind
        run: |
          for name in api-gateway auth catalog orders notifications cron1 cron2; do
            kind load docker-image "${name}:${BASELINE_IMAGE_TAG}" --name p8-kind
          done

      - uses: azure/setup-helm@v4
        with:
          # Helm 4 usa Server-Side Apply por defecto para releases nuevas.
          # Fijamos la versión para que el pipeline no cambie sin revisión.
          version: v4.3.0

      - name: Instalar el controlador de Argo Rollouts
        run: |
          kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
          # --server-side evita el límite de 256 KB en la anotación
          # last-applied-configuration que rompe con CRDs grandes como las
          # de Argo Rollouts bajo un `kubectl apply` normal.
          kubectl apply --server-side --force-conflicts -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
          kubectl -n argo-rollouts wait --for=condition=available --timeout=180s deployment --all

      - name: Instalar el plugin kubectl-argo-rollouts
        run: |
          curl -sSL -o kubectl-argo-rollouts https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts
          sudo mv kubectl-argo-rollouts /usr/local/bin/kubectl-argo-rollouts

      - name: Preparar dependencias del chart
        run: helm dependency update P8/charts/sa-platform

      - name: Desplegar el baseline en el clúster efímero
        run: |
          # Sin --wait: Helm intenta comprobar la salud del Rollout con un
          # chequeo genérico (kstatus) que no entiende su esquema de status
          # y se queda en "Unknown" hasta agotar el timeout. La espera real
          # del Rollout se hace aparte con wait-for-rollout.sh; los demás
          # recursos (Deployments/StatefulSets, que Helm sí reconoce) se
          # esperan en el siguiente paso.
          helm upgrade --install sa-platform P8/charts/sa-platform \
            --namespace sa-p5 \
            --create-namespace \
            --server-side=false \
            --values P8/charts/sa-platform/values.yaml \
            --values P8/charts/sa-platform/values-dev.yaml \
            --values P8/charts/sa-platform/values-kind.yaml \
            --set-string api-gateway.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string auth.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string catalog.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string orders.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string notifications.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string cronjobs.cron1.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string cronjobs.cron2.image.tag="$BASELINE_IMAGE_TAG" \
            --timeout 5m

      - name: Esperar a que los demás servicios (no el gateway) estén listos
        run: |
          for dep in $(kubectl get deployment -n sa-p5 -o jsonpath='{.items[*].metadata.name}'); do
            kubectl rollout status "deployment/$dep" -n sa-p5 --timeout=180s
          done
          for sts in $(kubectl get statefulset -n sa-p5 -o jsonpath='{.items[*].metadata.name}'); do
            kubectl rollout status "statefulset/$sts" -n sa-p5 --timeout=180s
          done

      - name: Esperar a que el Rollout inicial quede Healthy
        run: bash P8/scripts/wait-for-rollout.sh sa-platform-api-gateway sa-p5 Healthy 180

      # El primer `helm upgrade --install` no ejecuta pasos de canary (no hay
      # ReplicaSet estable previo contra el cual comparar), así que para
      # demostrar el canary real hay que publicar una segunda revisión.
      - name: Construir versiones adicionales del gateway para el canary
        run: |
          docker build -t "api-gateway:${HEALTHY_CANARY_IMAGE_TAG}" \
            --build-arg APP_VERSION="$HEALTHY_CANARY_IMAGE_TAG" --build-arg FAULT_MODE=false \
            P8/api-gateway
          docker build -t "api-gateway:${FAULT_CANARY_IMAGE_TAG}" \
            --build-arg APP_VERSION="$FAULT_CANARY_IMAGE_TAG" --build-arg FAULT_MODE=true \
            P8/api-gateway
          kind load docker-image "api-gateway:${HEALTHY_CANARY_IMAGE_TAG}" --name p8-kind
          kind load docker-image "api-gateway:${FAULT_CANARY_IMAGE_TAG}" --name p8-kind

      - name: "Canary sano: publicar versión nueva y verificar promoción automática"
        run: |
          helm upgrade --install sa-platform P8/charts/sa-platform \
            --namespace sa-p5 \
            --server-side=false \
            --values P8/charts/sa-platform/values.yaml \
            --values P8/charts/sa-platform/values-dev.yaml \
            --values P8/charts/sa-platform/values-kind.yaml \
            --set-string api-gateway.image.tag="$HEALTHY_CANARY_IMAGE_TAG" \
            --set-string auth.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string catalog.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string orders.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string notifications.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string cronjobs.cron1.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string cronjobs.cron2.image.tag="$BASELINE_IMAGE_TAG"
          bash P8/scripts/wait-for-rollout.sh sa-platform-api-gateway sa-p5 Healthy 180
          kubectl argo rollouts get rollout sa-platform-api-gateway -n sa-p5 --no-color

      - name: "Fallo inducido: publicar versión defectuosa (FAULT_MODE=true)"
        run: |
          helm upgrade --install sa-platform P8/charts/sa-platform \
            --namespace sa-p5 \
            --server-side=false \
            --values P8/charts/sa-platform/values.yaml \
            --values P8/charts/sa-platform/values-dev.yaml \
            --values P8/charts/sa-platform/values-kind.yaml \
            --set-string api-gateway.image.tag="$FAULT_CANARY_IMAGE_TAG" \
            --set-string auth.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string catalog.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string orders.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string notifications.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string cronjobs.cron1.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string cronjobs.cron2.image.tag="$BASELINE_IMAGE_TAG"

      - name: Verificar que el canary detecta el fallo y revierte automáticamente
        run: |
          verification_status=0
          bash P8/scripts/wait-for-rollout.sh sa-platform-api-gateway sa-p5 Degraded 180 || verification_status=$?
          echo "--- Evidencia: estado del Rollout tras el fallo inducido ---"
          kubectl argo rollouts get rollout sa-platform-api-gateway -n sa-p5 --no-color || true
          echo "--- Evidencia: AnalysisRuns y mediciones ---"
          kubectl get analysisruns -n sa-p5 -o wide || true
          kubectl get analysisruns -n sa-p5 -o yaml || true
          echo "--- Evidencia: selectores de los Services estable y canary ---"
          kubectl get service sa-platform-api-gateway-stable sa-platform-api-gateway-canary -n sa-p5 -o yaml || true
          echo "--- Evidencia: endpoints actuales del Service canary ---"
          kubectl get endpointslices -n sa-p5 \
            -l kubernetes.io/service-name=sa-platform-api-gateway-canary \
            -o yaml || true
          echo "--- Evidencia: pods, imágenes y hashes del gateway ---"
          kubectl get pods -n sa-p5 -l app.kubernetes.io/name=api-gateway -o wide --show-labels || true
          exit "$verification_status"

      - name: Verificar el despliegue
        if: always()
        run: |
          kubectl get pods -n sa-p5 -o wide
          kubectl get pvc,svc -n sa-p5
          kubectl get cronjobs -n sa-p5
          kubectl get rollout,analysistemplate -n sa-p5

      - name: Diagnóstico si algo falló
        if: failure()
        run: |
          kubectl describe pods -n sa-p5
          kubectl logs -n sa-p5 -l app.kubernetes.io/part-of=sa-platform --all-containers --tail=100 || true
          kubectl describe rollout sa-platform-api-gateway -n sa-p5 || true

  # ---------------------------------------------------------------------
  # Etapa 4b: políticas de admisión con Kyverno, en un clúster kind propio
  # e independiente del de deploy-kind (para no arriesgar ese job, que ya
  # está probado). Instala Kyverno, aplica las 3 políticas de
  # P8/kyverno/policies/, e intenta desplegar dos pods que las violan a
  # propósito para dejar evidencia real de rechazo. No corre en Pull
  # Requests por el mismo motivo que deploy-kind: no hay nada publicado
  # todavía para probar.
  # ---------------------------------------------------------------------
  kyverno-policy-check:
    name: "Kyverno: políticas de admisión"
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear clúster local con kind
        uses: helm/kind-action@v1
        with:
          cluster_name: p8-kyverno

      - name: Instalar Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install kyverno kyverno/kyverno \
            --namespace kyverno --create-namespace \
            --wait --timeout 180s

      - name: Aplicar las 3 políticas de admisión
        run: |
          # Las políticas están acotadas al namespace sa-p5 (no a todo el
          # clúster, para no arriesgar bloquear componentes de plataforma
          # como argocd/kyverno/sealed-secrets) — hay que probarlas ahí,
          # no en "default".
          kubectl create namespace sa-p5 --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f P8/kyverno/policies/
          kubectl wait --for=condition=Ready clusterpolicy --all --timeout=60s
          kubectl get clusterpolicy

      - name: "Caso rechazado 1: imagen externa, root, sin firmar (debe bloquearse)"
        run: |
          set +e
          OUTPUT=$(kubectl run policy-check-external-image -n sa-p5 --image=nginx:latest --restart=Never 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: Kyverno debía rechazar nginx:latest (registry externo + root) y no lo hizo."
            exit 1
          fi
          echo "$OUTPUT" | grep -q "restrict-image-registries" || { echo "ERROR: no se activó restrict-image-registries."; exit 1; }
          echo "$OUTPUT" | grep -q "require-non-root-user" || { echo "ERROR: no se activó require-non-root-user."; exit 1; }
          echo "OK: Kyverno rechazó correctamente el despliegue no conforme."

      # Confirma también que la política NO aplica fuera de sa-p5 (alcance
      # acotado a propósito, ver Fase 12 de CAMBIOS-GITOPS.md).
      - name: "Caso permitido: mismo pod no conforme, pero fuera de sa-p5 (no debe bloquearse)"
        run: |
          kubectl run policy-check-outside-scope -n default --image=nginx:latest --restart=Never
          kubectl delete pod policy-check-outside-scope -n default --ignore-not-found
          echo "OK: fuera de sa-p5 el mismo pod no conforme no fue bloqueado (alcance acotado funcionando)."

      - name: "Caso rechazado 2: imagen propia sin firma verificable (debe bloquearse)"
        run: |
          set +e
          OUTPUT=$(kubectl run policy-check-unsigned -n sa-p5 --image="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sa-notification-service:${GITHUB_SHA:0:7}" --restart=Never 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: Kyverno debía rechazar este pod (sin runAsNonRoot y sin poder verificar firma en este clúster efímero) y no lo hizo."
            exit 1
          fi
          echo "$OUTPUT" | grep -q "verify-image-signatures\|require-non-root-user" || { echo "ERROR: no se activó ninguna política esperada."; exit 1; }
          echo "OK: Kyverno rechazó correctamente el despliegue no conforme."

      # Nota: el camino "permitido" de verify-image-signatures (una imagen
      # firmada que SÍ pasa la verificación) necesita que Kyverno pueda
      # autenticarse contra GHCR para leer la firma de Cosign — este
      # clúster kind efímero no tiene esas credenciales configuradas
      # (a propósito: nadie las va a dejar tiradas en un runner temporal).
      # Ese camino se valida más adelante, sobre el clúster AKS real, que
      # sí va a tener el imagePullSecret ghcr-secret. Lo que este job
      # demuestra es que las 3 políticas están activas y rechazan
      # correctamente lo que no cumple, que es el requisito eliminatorio.

  # ---------------------------------------------------------------------
  # Etapa 4c: prueba de carga con k6, contra un despliegue baseline propio
  # en kind (otro clúster efímero independiente, mismo motivo que
  # kyverno-policy-check: no arriesgar el job de deploy-kind ya probado).
  # No corre en Pull Requests, mismo motivo que los demás jobs de esta
  # etapa: build-and-push no publicó nada que desplegar todavía.
  # ---------------------------------------------------------------------
  load-test:
    name: "Prueba de carga (k6)"
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar las 7 imágenes ya publicadas en GHCR
        run: |
          declare -A IMAGES=(
            [api-gateway]=sa-api-gateway
            [auth]=sa-auth-service
            [catalog]=sa-catalog-service
            [orders]=sa-order-service
            [notifications]=sa-notification-service
            [cron1]=sa-cron1
            [cron2]=sa-cron2
          )
          SHORT_SHA="${GITHUB_SHA:0:7}"
          for plain in "${!IMAGES[@]}"; do
            ghcr_image="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${IMAGES[$plain]}:${SHORT_SHA}"
            docker pull "$ghcr_image"
            docker tag "$ghcr_image" "${plain}:${BASELINE_IMAGE_TAG}"
          done

      - name: Crear clúster local con kind
        uses: helm/kind-action@v1
        with:
          cluster_name: p8-loadtest

      - name: Cargar las imágenes al clúster de kind
        run: |
          for name in api-gateway auth catalog orders notifications cron1 cron2; do
            kind load docker-image "${name}:${BASELINE_IMAGE_TAG}" --name p8-loadtest
          done

      - uses: azure/setup-helm@v4
        with:
          # Mismo motivo que en deploy-kind: Helm 4 usa Server-Side Apply
          # por defecto, de ahí el --server-side=false de abajo. Sin este
          # paso, el runner trae un Helm 3.x que ni siquiera reconoce esa
          # flag.
          version: v4.3.0

      - name: Instalar el controlador de Argo Rollouts
        run: |
          # El chart de sa-platform define recursos Rollout/AnalysisTemplate
          # (argoproj.io/v1alpha1): sin estos CRDs, "helm upgrade --install"
          # falla al no reconocer esos kinds. Mismo paso que deploy-kind; acá
          # no hace falta además el plugin kubectl-argo-rollouts porque este
          # job no corre canary, solo espera Healthy con wait-for-rollout.sh.
          kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
          kubectl -n argo-rollouts wait --for=condition=available --timeout=180s deployment --all

      - name: Preparar dependencias del chart
        run: helm dependency update P8/charts/sa-platform

      - name: Desplegar el baseline (sin canary, solo para la prueba de carga)
        run: |
          helm upgrade --install sa-platform P8/charts/sa-platform \
            --namespace sa-p5 \
            --create-namespace \
            --server-side=false \
            --values P8/charts/sa-platform/values.yaml \
            --values P8/charts/sa-platform/values-dev.yaml \
            --values P8/charts/sa-platform/values-kind.yaml \
            --set-string api-gateway.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string auth.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string catalog.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string orders.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string notifications.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string cronjobs.cron1.image.tag="$BASELINE_IMAGE_TAG" \
            --set-string cronjobs.cron2.image.tag="$BASELINE_IMAGE_TAG" \
            --timeout 5m
          for dep in $(kubectl get deployment -n sa-p5 -o jsonpath='{.items[*].metadata.name}'); do
            kubectl rollout status "deployment/$dep" -n sa-p5 --timeout=180s
          done
          # Sin este loop, mysql/mongodb/nats pueden seguir arrancando
          # cuando el resto ya reporta "Ready" (el rollout status de un
          # Deployment no depende de que sus StatefulSets ya estén arriba),
          # y las primeras requests reales fallan o quedan carísimas.
          # Comprobado a mano: sin este wait, orders/graphql devolvía un
          # error real de conexión a MySQL con status 200 igual.
          for sts in $(kubectl get statefulset -n sa-p5 -o jsonpath='{.items[*].metadata.name}'); do
            kubectl rollout status "statefulset/$sts" -n sa-p5 --timeout=180s
          done
          bash P8/scripts/wait-for-rollout.sh sa-platform-api-gateway sa-p5 Healthy 180

      - name: Instalar k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz -o k6.tar.gz
          tar xzf k6.tar.gz --strip-components 1 k6-v2.2.0-linux-amd64/k6
          sudo mv k6 /usr/local/bin/k6
          k6 version

      - name: Exponer el API Gateway en localhost
        run: |
          kubectl port-forward -n sa-p5 svc/sa-platform-api-gateway 8080:80 &
          echo $! > /tmp/port-forward.pid
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done

      # catalog/orders recién abren su primera conexión real a
      # MongoDB/MySQL en este momento (el clúster se acaba de crear); esa
      # primera consulta es varios órdenes de magnitud más lenta que las
      # siguientes y, si no se descarta, infla el p95 de la corrida medida
      # sin que eso refleje ningún problema real de la aplicación
      # (comprobado a mano: sin precalentar, p95 llegó a 30s; ya caliente,
      # p95 baja a ~107ms). Se precalienta antes de medir.
      - name: Precalentar los servicios antes de medir
        run: |
          for i in $(seq 1 5); do
            curl -sf http://localhost:8080/health >/dev/null
            curl -sf -X POST http://localhost:8080/api/catalog/graphql \
              -H "Content-Type: application/json" \
              -d '{"query":"{ products { id } }"}' >/dev/null
            curl -sf -X POST http://localhost:8080/api/orders/graphql \
              -H "Content-Type: application/json" \
              -d '{"query":"{ orders { id } }"}' >/dev/null
          done

      - name: Correr la prueba de carga
        run: |
          k6 run \
            -e BASE_URL=http://localhost:8080 \
            --summary-export=P8/loadtest/reporte-ultima-corrida.json \
            P8/loadtest/api-gateway-load-test.js

      - name: Detener el port-forward
        if: always()
        run: kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true

      - name: Subir el reporte de la prueba de carga como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-prueba-de-carga
          path: P8/loadtest/reporte-ultima-corrida.json
          retention-days: 30

  # ---------------------------------------------------------------------
  # Etapa 5: promoción GitOps. Este job NO toca el clúster de AKS bajo
  # ninguna circunstancia (nada de az login, kubectl ni helm upgrade aquí).
  # Su única responsabilidad es sincronizar el chart de Helm hacia el
  # repositorio GitOps (https://github.com/ELFBIBv/Practicas-SA-B-202203856-gitops),
  # actualizar el tag de imagen al commit recién publicado en GHCR, y abrir
  # un Pull Request ahí. Quien aplica el cambio al clúster es ArgoCD,
  # corriendo dentro del propio AKS, cuando ese PR se mergea a main.
  # Solo corre si se lanza manualmente el workflow (workflow_dispatch) con
  # el checkbox "deploy" activado, y solo si existe el secret GITOPS_PAT
  # descrito en P8/README.md.
  # ---------------------------------------------------------------------
  promote-to-gitops:
    name: "Proponer despliegue (PR al repo GitOps)"
    # Las 4 validaciones tienen que pasar antes de proponer nada al repo
    # GitOps — sin esto, build-and-push solo (sin esperar a deploy-kind,
    # kyverno-policy-check ni load-test, que corren en paralelo) podía
    # abrir el PR aunque alguna de esas tres terminara fallando después.
    # Si alguna falla, GitHub Actions salta este job automáticamente (no
    # hace falta un "always()": ese es el comportamiento por defecto de
    # "needs" cuando cualquiera de sus jobs no tiene éxito).
    needs: [build-and-push, deploy-kind, kyverno-policy-check, load-test]
    # workflow_dispatch se puede lanzar desde cualquier rama; sin este
    # chequeo, correrlo desde una rama que no sea main podía promover un
    # estado que nunca pasó por el flujo de PR normal del repo de código.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GITOPS_REPO: ELFBIBv/Practicas-SA-B-202203856-gitops
      GH_TOKEN: ${{ secrets.GITOPS_PAT }}
    steps:
      - name: Checkout del repo de código (fuente del chart)
        uses: actions/checkout@v4
        with:
          path: source

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      # Gate explícito que pide el enunciado ("validación mediante helm
      # lint dentro del pipeline"): antes de proponer nada, el chart que
      # de verdad va a llegar a producción (values-azure.yaml) tiene que
      # lintear limpio.
      - name: helm dependency update + lint --strict (values-azure.yaml)
        run: |
          helm dependency update source/P8/charts/sa-platform
          helm lint --strict source/P8/charts/sa-platform \
            --values source/P8/charts/sa-platform/values.yaml \
            --values source/P8/charts/sa-platform/values-azure.yaml

      - name: Clonar el repositorio GitOps
        run: |
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" gitops
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

      - name: Sincronizar el chart de Helm hacia el repo GitOps
        run: |
          rsync -a --delete \
            --exclude 'charts/*.tgz' \
            source/P8/charts/sa-platform/ gitops/charts/sa-platform/

      - name: Actualizar el tag de imagen al commit recién publicado
        run: |
          python3 source/P8/scripts/bump-image-tag.py \
            gitops/charts/sa-platform/values-azure.yaml \
            "${GITHUB_SHA:0:7}"

      - name: Abrir Pull Request en el repo GitOps
        run: |
          cd gitops
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="promote/${SHORT_SHA}"
          git config user.name "sa-platform-ci"
          git config user.email "ci@sa-platform.local"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que promover (el chart y los tags ya están al día)."
            exit 0
          fi
          git commit -m "deploy: promover sa-platform a ${SHORT_SHA}"
          git push origin "$BRANCH"
          gh pr create --repo "$GITOPS_REPO" \
            --title "Promover sa-platform a ${SHORT_SHA}" \
            --body "Generado automáticamente por el pipeline de CI del repo de código en el commit ${{ github.sha }}. ArgoCD debe sincronizar este cambio al hacer merge." \
            --base main --head "$BRANCH"
