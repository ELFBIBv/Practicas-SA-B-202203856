{{- if not .Values.auth.existingSecret -}}
{{- $secretName := include "mongodb.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := randAlphaNum 32 | b64enc -}}
{{- if and $existing $existing.data -}}
{{- $password = index $existing.data "mongodb-root-password" | default $password -}}
{{- end -}}
{{- $passwordPlain := $password | b64dec -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    app: mongodb
type: Opaque
data:
  mongodb-root-username: {{ .Values.auth.username | b64enc | quote }}
  mongodb-root-password: {{ $password | quote }}
  mongodb-database: {{ .Values.auth.database | b64enc | quote }}
  MONGO_URI: {{ printf "mongodb://%s:%s@%s:27017/%s?authSource=admin" .Values.auth.username $passwordPlain (include "mongodb.fullname" .) .Values.auth.database | b64enc | quote }}
{{- end }}
