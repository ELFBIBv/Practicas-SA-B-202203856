{{- if not .Values.auth.existingSecret -}}
{{- $secretName := include "mysql.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $rootPassword := randAlphaNum 32 | b64enc -}}
{{- $password := randAlphaNum 32 | b64enc -}}
{{- if and $existing $existing.data -}}
{{- $rootPassword = index $existing.data "mysql-root-password" | default $rootPassword -}}
{{- $password = index $existing.data "DB_PASSWORD" | default $password -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    app: mysql
type: Opaque
data:
  mysql-root-password: {{ $rootPassword | quote }}
  DB_USER: {{ .Values.auth.username | b64enc | quote }}
  DB_PASSWORD: {{ $password | quote }}
  DB_NAME: {{ .Values.auth.database | b64enc | quote }}
{{- end }}
