apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verificar firma Cosign de la imagen
    policies.kyverno.io/category: Cadena de suministro (sa-platform)
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Rechaza cualquier imagen de ghcr.io/elfbibv/* que no esté firmada por
      el propio pipeline de CI (firma "keyless" de Cosign vía OIDC de
      GitHub Actions, ver el job build-and-push de ci-cd.yml). Cierra el
      círculo entre "se escaneó y se firmó en el pipeline" y "el clúster
      exige esa firma antes de correr nada".
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/elfbibv/*"
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/ELFBIBv/Practicas-SA-B-202203856/.github/workflows/ci-cd.yml@refs/heads/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
