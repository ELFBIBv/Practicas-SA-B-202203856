{{- if .Values.sealedSecrets.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sa-platform-mysql
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    DB_NAME: 
    DB_PASSWORD: 
    DB_USER: 
    mysql-root-password: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
        sealedsecrets.bitnami.com/patch: "true"
      name: sa-platform-mysql
      namespace: {{ .Release.Namespace }}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sa-platform-mongodb
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    MONGO_URI: 
    mongodb-database: 
    mongodb-root-password: 
    mongodb-root-username: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
        sealedsecrets.bitnami.com/patch: "true"
      name: sa-platform-mongodb
      namespace: {{ .Release.Namespace }}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sa-platform-auth-secrets
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    AES_SECRET_KEY: 
    JWT_SECRET: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
        sealedsecrets.bitnami.com/patch: "true"
      name: sa-platform-auth-secrets
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
