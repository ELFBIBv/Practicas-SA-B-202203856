apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-platform.fullname" . }}-cron1
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: cron1
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-platform.fullname" . }}-cron1
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sa-platform.fullname" . }}-cron1
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sa-platform.fullname" . }}-cron1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sa-platform.fullname" . }}-cron1
---
