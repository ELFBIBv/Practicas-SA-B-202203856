# Valores para el despliegue efímero de CI en kind (Kubernetes in Docker).
# Se usa junto con values.yaml + values-dev.yaml: helm upgrade --install ...
#   -f values.yaml -f values-dev.yaml -f values-kind.yaml
#
# Objetivo: que el runner de GitHub Actions (2 vCPU / ~7GB RAM) pueda levantar
# todo el stack sin quedarse sin recursos, probando el chart real sin ninguna
# nube ni imágenes publicadas (se cargan en local con `kind load docker-image`).
api-gateway:
  replicaCount: 1

auth:
  replicaCount: 1

catalog:
  replicaCount: 1

orders:
  replicaCount: 1

notifications:
  replicaCount: 1
