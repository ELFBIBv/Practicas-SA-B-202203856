apiVersion: v2
name: sa-platform
description: Plataforma de microservicios de SA desplegable en Kubernetes
type: application
version: 0.2.0
appVersion: "1.0.0"
dependencies:
  - name: api-gateway
    version: "0.2.0"
    repository: "file://./charts/api-gateway"
  - name: auth
    version: "0.1.0"
    repository: "file://./charts/auth"
  - name: catalog
    version: "0.1.0"
    repository: "file://./charts/catalog"
  - name: orders
    version: "0.1.0"
    repository: "file://./charts/orders"
  - name: notifications
    version: "0.1.0"
    repository: "file://./charts/notifications"
  - name: mysql
    version: "0.1.0"
    repository: "file://./charts/mysql"
  - name: nats
    version: "2.14.5"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
  - name: mongodb
    version: "0.1.0"
    repository: "file://./charts/mongodb"
