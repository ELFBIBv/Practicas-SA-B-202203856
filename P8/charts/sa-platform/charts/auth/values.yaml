replicaCount: 1
image:
  repository: auth
  pullPolicy: IfNotPresent
  tag: "latest"
serviceAccount:
  create: true
  name: ""
service:
  type: ClusterIP
  port: 4000
config:
  nodeEnv: development
  databaseUser: user
  databaseName: auth_db
  jwtExpiresIn: 1h
  jwtGracePeriodSeconds: "300"
  useAesForPassword: "false"
secrets:
  existingSecret: ""
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
global:
  environment: dev
  logLevel: info
  imagePullSecrets: []
