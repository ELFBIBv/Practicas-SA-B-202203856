worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # Auth Service
        location /api/auth/ {
            proxy_pass http://sa-platform-auth:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Catalog Service (GraphQL)
        location /api/catalog/ {
            proxy_pass http://sa-platform-catalog:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Orders Service (GraphQL)
        location /api/orders/ {
            proxy_pass http://sa-platform-orders:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Kubernetes verifica que el proceso pueda recibir tráfico sin usar
        # el endpoint que se altera durante el fallo inducido de P8.
        location = /ready {
            default_type application/json;
            add_header X-App-Version "__APP_VERSION__" always;
            return 200 '{"status":"ready","version":"__APP_VERSION__"}\n';
        }

        # Argo Rollouts consulta este endpoint en cada paso del canary.
        # Docker reemplaza los marcadores al construir la imagen.
        location = /health {
            default_type application/json;
            add_header X-App-Version "__APP_VERSION__" always;
            return __HEALTH_STATUS_CODE__ '{"status":"__HEALTH_STATUS__","version":"__APP_VERSION__"}\n';
        }

        location / {
            return 200 'healthy\n';
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
