replicaCount: 2
image:
  repository: catalog
  pullPolicy: IfNotPresent
  tag: "v8.0.0"
serviceAccount:
  create: true
  name: ""
service:
  type: ClusterIP
  port: 8000
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
global:
  environment: dev
  logLevel: info
  imagePullSecrets: []
