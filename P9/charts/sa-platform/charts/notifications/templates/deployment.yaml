apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notifications.fullname" . }}
  labels:
    {{- include "notifications.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "notifications.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notifications.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "notifications.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.spreadAcrossNodes }}
      # Rúbrica 2.5: las réplicas se reparten entre nodos para que drenar uno
      # deje réplicas sirviendo. Spread con DoNotSchedule + nodeTaintsPolicy
      # Honor: el nodo acordonado por `kubectl drain` sale del cálculo del
      # skew, así que los Pods desalojados SÍ se reprograman en el nodo que
      # queda (con `required` anti-affinity y 2 nodos quedarían Pending).
      # matchLabelKeys separa las revisiones de un rolling update/canary.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              {{- include "notifications.selectorLabels" . | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "notifications.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "notifications.fullname" . }}-config
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.natsAuthSecretName }}
                  key: NATS_URL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          # Rúbrica 2.5: al desalojar el Pod (drain, rollout) el Service y el
          # balanceador tardan en retirarlo de los endpoints; si el proceso
          # muere de inmediato, esas peticiones fallan con conexión rechazada
          # (observado en la prueba local de drenaje: 1 fallo en 100 sondeos).
          # La acción nativa sleep (sin binario en la imagen) mantiene el Pod
          # sirviendo mientras se propaga la baja.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds | default 5 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
