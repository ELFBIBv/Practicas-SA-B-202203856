{{- if .Values.global.natsAuthSecretCreate -}}
{{- $secretName := .Values.global.natsAuthSecretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- /* NATS parses an unquoted token beginning with a digit as a number. */ -}}
{{- $token := randAlpha 40 -}}
{{- if and $existing $existing.data (index $existing.data "token") -}}
{{- $token = index $existing.data "token" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
  NATS_URL: {{ printf "nats://%s@%s-nats:4222" $token .Release.Name | b64enc | quote }}
{{- end }}
