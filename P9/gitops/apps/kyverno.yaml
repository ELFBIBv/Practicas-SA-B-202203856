# Wave -20: motor de admisión Kyverno (CRD + webhooks). Las políticas van en
# la wave -5, cuando sus CRD ya existen.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: p9-platform
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    # CRDs de Kyverno: Kubernetes normaliza .spec.preserveUnknownFields y
    # añade annotations autogeneradas (kubectl.kubernetes.io/last-applied-
    # configuration, controller-gen.kubebuilder.io/version) que no están en
    # la fuente. Sin este ignore, ArgoCD marca 11 CRDs como OutOfSync de
    # forma permanente y la ola nunca cierra.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"'
        - '.metadata.annotations."controller-gen.kubebuilder.io/version"'
        - '.spec.preserveUnknownFields'
    # Job de migración: al completarse, Kubernetes muta .spec.selector y
    # .spec.template.metadata.annotations. El Job no se re-ejecuta; el
    # drift es cosmético.
    - group: batch
      kind: Job
      jqPathExpressions:
        - '.spec.selector'
        - '.spec.template.metadata.annotations'
        - '.spec.template.metadata.labels'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      # H8: borrar el CRD ClusterPolicy en cascada eliminaría las políticas y
      # dejaría la admisión de sa-p5 sin control.
      - Delete=false