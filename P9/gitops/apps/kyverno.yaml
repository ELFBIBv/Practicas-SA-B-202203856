# Wave -20: motor de admisión Kyverno (CRD + webhooks). Las políticas van en
# la wave -5, cuando sus CRD ya existen.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: p9-platform
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      # Sus webhooks fallan cerrados (failurePolicy: Fail, también en DELETE de
      # Pods). Con 1 réplica, drenar su nodo dejó el reemplazo Pending por CPU
      # y bloqueó tanto los Pods nuevos de sa-p5 como el borrado de los
      # desalojados: el drenaje no terminaba (prueba de nodo, 2026-10-17).
      # 2 réplicas, una por nodo; con replicas > 1 el chart crea el PDB
      # (minAvailable 1). Sin nodeTaintsPolicy: Honor a propósito: el nodo
      # acordonado sigue contando, así el desalojado no se apila en el otro.
      valuesObject:
        admissionController:
          replicas: 2
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys: [pod-template-hash]
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: admission-controller
                  app.kubernetes.io/instance: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    # ServerSideDiff=true no suprime el default del apiserver en algunos CRD
    # nuevos (Kyverno 3.9.1: deletingpolicies, mutatingpolicies, etc.) solo
    # con '.spec' amplio: el apiserver rellena .spec.conversion.strategy=None
    # y esa ruta puntual sigue marcando OutOfSync pese al ignore de '.spec'.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.spec'
        - '.spec.conversion'
        - '.metadata.annotations'
    - group: batch
      kind: Job
      jqPathExpressions:
        - '.metadata.annotations'
        - '.metadata.labels'
        - '.spec.selector'
        - '.spec.template.metadata.annotations'
        - '.spec.template.metadata.labels'
        - '.spec.completions'
        - '.spec.parallelism'
        - '.spec.suspend'
        - '.spec.podReplacementPolicy'
    # Kyverno inyecta su CA interna en el caBundle de los webhooks en
    # runtime. Sin ignorarlo, ArgoCD marca los 10 webhooks como OutOfSync
    # de forma permanente. Es el problema más documentado de Kyverno +
    # ArgoCD y la causa más probable del OutOfSync tras el primer sync.
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - Delete=false