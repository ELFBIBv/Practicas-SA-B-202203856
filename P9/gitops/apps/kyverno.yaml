# Wave -20: motor de admisión Kyverno (CRD + webhooks). Las políticas van en
# la wave -5, cuando sus CRD ya existen.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: p9-platform
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # H8: borrar el CRD ClusterPolicy en cascada eliminaría las políticas y
      # dejaría la admisión de sa-p5 sin control.
      - Delete=false
