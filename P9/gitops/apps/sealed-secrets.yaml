# Wave -30: controlador de Sealed Secrets. Debe ser lo primero para que los
# SealedSecret de las waves siguientes se puedan descifrar.
# [PUNTO DE INTEGRACIÓN CON SECRETOS] la llave del controlador ya tiene que
# estar restaurada en kube-system cuando esta app sincronice. La restaura
# bootstrap.sh (restore-sealed-secrets-key.sh) entre 01-cluster y 02-platform,
# antes de que exista ArgoCD. Si no, el controlador genera una llave nueva y
# los SealedSecret del repo quedan inservibles. Los valores de esta app los
# define P9/docs/diseño-secretos-dr.md §3.4.
# Sin resources-finalizer: borrar la app no debe borrar el CRD (arrastraría
# todos los SealedSecret y, por ownerReferences, sus Secrets).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: p9-platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      # Mismo nombre que en P8: kubeseal --controller-name=sealed-secrets-controller.
      releaseName: sealed-secrets-controller
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        # Sin rotación: la llave activa es siempre la que está en custodia.
        keyrenewperiod: "0"
        # Publica status.conditions[Synced], que usa el health de ArgoCD.
        updateStatus: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1 # H7: con límite finito, ArgoCD deja de reintentar la misma revisión al agotarlo.
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - ServerSideApply=true
      # H8: `argocd app delete` hace cascada por defecto. Sin esto, borrar esta
      # Application borraría el CRD SealedSecret y, por ownerReferences, sus Secrets.
      - Delete=false
