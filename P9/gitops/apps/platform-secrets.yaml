# Ola -10: los 3 SealedSecret que faltan en Git (sa-p5/ghcr-secret,
# sa-p5/sa-platform-nats-auth y kyverno/ghcr-secret). Sin ellos: ImagePullBackOff
# en sa-p5, rechazo de verifyImages por Kyverno, y NATS sin autenticación.
# Cada manifiesto declara su propio namespace (sa-p5 o kyverno); destination.namespace
# es solo el valor por defecto que usa ArgoCD para el diffing.
# [PUNTO DE INTEGRACIÓN CON SECRETOS] contenido: P9/docs/diseno-secretos-dr.md §3.2
# (brecha §2) y §3.6. Publicado desde P9/gitops/platform-secrets/*.sealed.yaml
# (fuente en el repo de código; ver decisión abierta 2.2 de decisiones-pendientes.md:
# aún no se han sellado ni publicado — requiere la llave viva de aks-sa-p8, Ruta A).
# Fuente de esta Application: P9/docs/diseno-sync-waves.md §2.5 (ajusta
# proyecto y namespace por defecto respecto a diseno-secretos-dr.md §3.4).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: p9-platform
  source:
    repoURL: https://github.com/ELFBIBv/Practicas-SA-B-202203856-gitops.git
    targetRevision: main
    path: platform-secrets # publicado desde P9/gitops/platform-secrets/
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p5
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
