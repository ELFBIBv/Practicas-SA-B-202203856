version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
      # - catalog-service
      # - order-service
    networks:
      - p4-network

  auth-service:
    build: ./auth/auth-service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_HOST=postgres-auth
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=auth_db
    depends_on:
      - postgres-auth
    networks:
      - p4-network

