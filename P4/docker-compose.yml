  postgres-auth:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    ports:
      - "5432:5432"
    volumes:
      - ./auth/auth-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - p4-network

