{{- if not .Values.secrets.existingSecret -}}
{{- $secretName := include "auth.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $aesSecret := randAlphaNum 48 | b64enc -}}
{{- $jwtSecret := randAlphaNum 48 | b64enc -}}
{{- if and $existing $existing.data -}}
{{- $aesSecret = index $existing.data "AES_SECRET_KEY" | default $aesSecret -}}
{{- $jwtSecret = index $existing.data "JWT_SECRET" | default $jwtSecret -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
type: Opaque
data:
  AES_SECRET_KEY: {{ $aesSecret | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
{{- end }}
