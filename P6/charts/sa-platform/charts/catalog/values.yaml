replicaCount: 2
image:
  repository: catalog
  pullPolicy: IfNotPresent
  tag: "latest"
serviceAccount:
  create: true
  name: ""
service:
  type: ClusterIP
  port: 8000
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
global:
  environment: dev
  logLevel: info
  imagePullSecrets: []
