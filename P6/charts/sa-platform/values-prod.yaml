global:
  environment: prod

serviceAccount:
  create: true
  name: ""

mysql:
  primary:
    persistence:
      size: 5Gi

apiGateway:
  replicaCount: 3
  resources:
    limits:
      cpu: 200m
      memory: 256Mi

authService:
  replicaCount: 3
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

catalogService:
  replicaCount: 3
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

orderService:
  replicaCount: 3
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

notificationService:
  replicaCount: 3
  resources:
    limits:
      cpu: 200m
      memory: 256Mi

