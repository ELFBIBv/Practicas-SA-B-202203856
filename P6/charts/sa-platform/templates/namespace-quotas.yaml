apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "sa-platform.fullname" . }}-quota
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | quote }}
    limits.cpu: {{ .Values.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.quota.limitsMemory | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "sa-platform.fullname" . }}-limits
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
